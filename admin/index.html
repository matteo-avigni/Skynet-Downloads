<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Skynet Release Control</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="../assets/skynet-mark-transparent.png">
    <style>
      :root {
        color-scheme: dark;
        --background: #101312;
        --surface: #181d1b;
        --border: #3b4641;
        --text: #f4f7f5;
        --muted: #aeb9b4;
        --green: #36d477;
        --green-strong: #1fb45e;
        --blue: #6eb8ff;
        --danger: #ff6b6b;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--background);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(100% - 32px, 920px);
        margin: 0 auto;
        padding: 40px 0 64px;
      }

      header {
        display: flex;
        gap: 20px;
        align-items: center;
        justify-content: space-between;
        padding-bottom: 24px;
        border-bottom: 1px solid var(--border);
      }

      h1, h2, p { margin: 0; }
      h1 { font-size: 30px; letter-spacing: 0; }
      h2 { font-size: 19px; letter-spacing: 0; }

      .back {
        color: var(--blue);
        font-weight: 700;
        text-decoration: none;
      }

      section {
        padding: 24px 0;
        border-bottom: 1px solid var(--border);
      }

      .release-row,
      .auth-row,
      .action-row,
      .run {
        display: grid;
        gap: 12px;
        align-items: center;
      }

      .release-row { grid-template-columns: 1fr auto; margin-top: 16px; }
      .auth-row { grid-template-columns: minmax(0, 1fr) auto; margin-top: 16px; }
      .action-row { grid-template-columns: auto 1fr; margin-top: 16px; }

      label {
        display: block;
        margin-bottom: 7px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
      }

      input {
        width: 100%;
        min-height: 44px;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--surface);
        color: var(--text);
        font: inherit;
      }

      button {
        min-height: 44px;
        padding: 10px 16px;
        border: 1px solid var(--green-strong);
        border-radius: 6px;
        background: var(--green);
        color: #07120c;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }

      button.secondary {
        border-color: var(--border);
        background: var(--surface);
        color: var(--text);
      }

      button:disabled { cursor: wait; opacity: 0.55; }
      button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }

      .version,
      .status {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 14px;
      }

      .version { color: var(--green); font-weight: 700; }
      .muted { color: var(--muted); }
      .error { color: var(--danger); }

      #runs { margin-top: 16px; }
      .run {
        grid-template-columns: minmax(0, 1fr) auto auto;
        min-height: 48px;
        padding: 10px 0;
        border-top: 1px solid var(--border);
      }

      .run a { color: var(--text); font-weight: 700; text-decoration: none; }
      .run time { color: var(--muted); font-size: 13px; }

      @media (max-width: 620px) {
        main { width: min(100% - 24px, 920px); padding-top: 24px; }
        header, .release-row, .auth-row, .action-row, .run { grid-template-columns: 1fr; align-items: stretch; }
        header { display: grid; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Skynet Release Control</h1>
        <a class="back" href="../">Public downloads</a>
      </header>

      <section aria-labelledby="current-title">
        <h2 id="current-title">Current package</h2>
        <div class="release-row">
          <p id="release-detail" class="muted">Loading manifest</p>
          <span id="version" class="version">Pending</span>
        </div>
      </section>

      <section aria-labelledby="publish-title">
        <h2 id="publish-title">Publish update feeds</h2>
        <div class="auth-row">
          <div>
            <label for="token">Admin token</label>
            <input id="token" type="password" autocomplete="off" spellcheck="false">
          </div>
          <button id="refresh" class="secondary" type="button">Refresh status</button>
        </div>
        <div class="action-row">
          <button id="publish" type="button">Publish current package</button>
          <p id="message" class="status muted" role="status" aria-live="polite"></p>
        </div>
      </section>

      <section aria-labelledby="runs-title">
        <h2 id="runs-title">Recent publishing runs</h2>
        <div id="runs" class="muted">Enter the admin token to load runs.</div>
      </section>
    </main>

    <script>
      const tokenInput = document.getElementById("token");
      const publishButton = document.getElementById("publish");
      const refreshButton = document.getElementById("refresh");
      const message = document.getElementById("message");
      const runsElement = document.getElementById("runs");

      function authorizationHeaders() {
        const token = tokenInput.value.trim();
        if (!token) throw new Error("Enter the admin token.");
        return { Authorization: `Bearer ${token}` };
      }

      async function adminRequest(path, options = {}) {
        const response = await fetch(path, {
          ...options,
          cache: "no-store",
          headers: { ...authorizationHeaders(), ...(options.headers || {}) },
        });
        if (!response.ok) {
          const payload = await response.json().catch(() => ({}));
          throw new Error(payload.error || `Request failed (${response.status}).`);
        }
        return response.json();
      }

      function runState(run) {
        if (run.status !== "completed") return run.status;
        return run.conclusion || "completed";
      }

      async function loadRuns() {
        refreshButton.disabled = true;
        try {
          const payload = await adminRequest("../api/admin/runs");
          runsElement.className = "";
          runsElement.replaceChildren();
          if (!payload.runs.length) {
            runsElement.textContent = "No publishing runs yet.";
            return;
          }
          for (const run of payload.runs) {
            const row = document.createElement("div");
            row.className = "run";
            const link = document.createElement("a");
            link.href = run.url;
            link.rel = "noopener noreferrer";
            link.textContent = `${run.title} (${run.revision})`;
            const state = document.createElement("span");
            state.className = "status";
            state.textContent = runState(run);
            const time = document.createElement("time");
            time.dateTime = run.createdAt;
            time.textContent = new Date(run.createdAt).toLocaleString();
            row.append(link, state, time);
            runsElement.append(row);
          }
        } catch (error) {
          runsElement.textContent = error.message;
          runsElement.className = "error";
        } finally {
          refreshButton.disabled = false;
        }
      }

      async function publish() {
        publishButton.disabled = true;
        message.className = "status muted";
        message.textContent = "Submitting publish job";
        try {
          await adminRequest("../api/admin/publish", { method: "POST" });
          message.textContent = "Publish job queued.";
          await loadRuns();
        } catch (error) {
          message.className = "status error";
          message.textContent = error.message;
        } finally {
          publishButton.disabled = false;
        }
      }

      fetch("../downloads/latest.json", { cache: "no-store" })
        .then((response) => {
          if (!response.ok) throw new Error();
          return response.json();
        })
        .then((release) => {
          document.getElementById("version").textContent = `v${release.version} (${release.build})`;
          document.getElementById("release-detail").textContent = "Windows 11 and macOS installers";
        })
        .catch(() => {
          document.getElementById("release-detail").textContent = "Manifest unavailable";
        });

      publishButton.addEventListener("click", publish);
      refreshButton.addEventListener("click", loadRuns);
      tokenInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") loadRuns();
      });
    </script>
  </body>
</html>
