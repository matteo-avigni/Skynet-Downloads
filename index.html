<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Skynet Installers</title>
    <meta name="description" content="Official Windows and macOS installers for Skynet.">
    <style>
      :root {
        color-scheme: dark;
        --background: #101312;
        --surface: #181d1b;
        --border: #3b4641;
        --text: #f4f7f5;
        --muted: #aeb9b4;
        --green: #36d477;
        --green-strong: #1fb45e;
        --blue: #6eb8ff;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--background);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(100% - 32px, 1040px);
        margin: 0 auto;
        padding: 42px 0 64px;
      }

      .masthead {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(300px, 440px);
        gap: 32px;
        align-items: center;
        padding-bottom: 32px;
        border-bottom: 1px solid var(--border);
      }

      .brand-lockup {
        display: block;
        width: 100%;
        height: auto;
        object-fit: contain;
      }

      h1, h2, p { margin: 0; }

      h1 {
        font-size: clamp(38px, 8vw, 62px);
        line-height: 1;
        letter-spacing: 0;
      }

      .lede {
        max-width: 680px;
        margin-top: 14px;
        color: var(--muted);
        font-size: 18px;
        line-height: 1.55;
      }

      .release { margin-top: 32px; }

      .release-header {
        display: flex;
        flex-wrap: wrap;
        gap: 12px 20px;
        align-items: baseline;
        justify-content: space-between;
      }

      h2 {
        font-size: 25px;
        line-height: 1.25;
        letter-spacing: 0;
      }

      .version {
        color: var(--green);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 14px;
        font-weight: 700;
      }

      .installer-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
        margin-top: 22px;
      }

      .installer {
        min-width: 0;
        padding: 22px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
      }

      .installer h3 {
        margin: 0;
        font-size: 20px;
        letter-spacing: 0;
      }

      .installer p {
        min-height: 48px;
        margin-top: 8px;
        color: var(--muted);
        line-height: 1.5;
      }

      .download {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        margin-top: 18px;
        padding: 10px 16px;
        border: 1px solid var(--green-strong);
        border-radius: 6px;
        background: var(--green);
        color: #07120c;
        font-weight: 800;
        text-decoration: none;
      }

      .download:hover,
      .download:focus-visible {
        background: #55e68d;
        outline: 2px solid var(--blue);
        outline-offset: 3px;
      }

      .download[aria-disabled="true"] {
        border-color: var(--border);
        background: #2a312e;
        color: var(--muted);
        pointer-events: none;
      }

      @media (max-width: 700px) {
        main {
          width: min(100% - 24px, 1040px);
          padding-top: 24px;
        }

        .masthead {
          grid-template-columns: 1fr;
          gap: 24px;
        }

        .brand-lockup {
          width: min(100%, 440px);
        }

        .installer-grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <main>
      <header class="masthead">
        <div>
          <h1>Skynet Installers</h1>
          <p class="lede">Official installation packages for Windows 11 and macOS.</p>
        </div>
        <img class="brand-lockup" src="assets/skynet-lockup-transparent.png" alt="Skynet Satellite Tracking System">
      </header>

      <section class="release" aria-labelledby="release-title">
        <div class="release-header">
          <h2 id="release-title">Current version</h2>
          <span id="version" class="version">Checking availability</span>
        </div>
        <div id="installers" class="installer-grid">
          <article class="installer">
            <h3>Windows 11</h3>
            <p id="windows-description">x64 installation wizard.</p>
            <a id="windows-download" class="download" aria-disabled="true">Pending build</a>
          </article>

          <article class="installer">
            <h3>macOS</h3>
            <p>Developer ID signed, notarized universal installer.</p>
            <a id="macos-download" class="download" aria-disabled="true">Pending build</a>
          </article>
        </div>
      </section>

    </main>

    <script>
      const versionElement = document.getElementById("version");

      fetch("downloads/latest.json", { cache: "no-store" })
        .then((response) => {
          if (!response.ok) throw new Error("No current installer manifest");
          return response.json();
        })
        .then((release) => {
          if (!release.version || !release.build) {
            throw new Error("Incomplete installer manifest");
          }

          versionElement.textContent = `v${release.version} (${release.build})`;
          const windowsAvailable = Boolean(release.windows?.path);
          const macosAvailable = Boolean(release.macos?.path);
          if (!windowsAvailable && !macosAvailable) {
            throw new Error("No installers in manifest");
          }

          const windowsDownload = document.getElementById("windows-download");
          const windowsDescription = document.getElementById("windows-description");
          const windowsSigned = release.windows?.signed !== false;
          if (windowsAvailable) {
            windowsDownload.href = release.windows.path;
            windowsDownload.textContent = windowsSigned ? "Download MSI" : "Download unsigned MSI";
            windowsDescription.textContent = windowsSigned
              ? "Authenticode-signed x64 installation wizard."
              : "Unsigned x64 installation wizard. Windows may show an unknown-publisher warning.";
            windowsDownload.removeAttribute("aria-disabled");
          }

          const macosDownload = document.getElementById("macos-download");
          if (macosAvailable) {
            macosDownload.href = release.macos.path;
            macosDownload.textContent = "Download PKG";
            macosDownload.removeAttribute("aria-disabled");
          }

        })
        .catch(() => {
          versionElement.textContent = "Publication pending";
        });
    </script>
  </body>
</html>
